# AWS Amplify Hosting build settings (the app lives in ./timewarpscanme)
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - cd timewarpscanme
        - yarn install --frozen-lockfile
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: timewarpscanme/build
    files:
      - '**/*'
  cache:
    paths:
      - timewarpscanme/node_modules/**/*
